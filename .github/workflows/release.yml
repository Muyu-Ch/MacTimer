name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use runner Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Build release assets
        run: |
          chmod +x macos/scripts/build.sh \
            macos/scripts/package-release.sh \
            "macos/scripts/Install Native Host.command"
          ./macos/scripts/package-release.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          body_path: .github/release-notes.md
          fail_on_unmatched_files: true
